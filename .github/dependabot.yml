version: 2

# Routine bumps arrive as one PR per ecosystem; majors still come in alone,
# because those are the ones worth reading a changelog for. Ungrouped, a quiet
# week opened eight PRs -- which is how they end up reviewed in bulk and merged
# unread.
updates:
  - package-ecosystem: mix
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    groups:
      hex:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  # One entry covers the whole pnpm workspace: the root lockfile resolves
  # npm/vite, npm/svelte, npm/doc-shell, and npm/lint too.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    groups:
      # Listed first, so the toolchain lands as its own reviewable PR instead of
      # being swept into the catch-all below.
      frontend-tooling:
        applies-to: version-updates
        patterns:
          - "@arethetypeswrong/*"
          - "@biomejs/*"
          - "@sveltejs/*"
          - "@types/*"
          - "@vitest/*"
          - happy-dom
          - knip
          - publint
          - svelte-check
          - tsup
          - typescript
          - vite
          - vitest
        update-types: [minor, patch]
      runtime:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
