name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

# Supersede an in-flight run when a new commit lands on the same ref, so a
# quick force-push does not queue redundant CI. `main` pushes keep a stable
# group key too, but branch protection serialises them anyway.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (elixir ${{ matrix.elixir }} / otp ${{ matrix.otp }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Two legs on merge, one on pull request. Floor = the oldest supported
      # toolchain compiles warning-free and passes ExUnit; full = the whole
      # quality gate (Elixir + frontend) plus coverage upload. A change that
      # passes `full` almost never breaks the floor on its own, and the floor
      # leg is a complete compile + ExUnit run, so PRs skip it and merges to
      # main still prove it.
      matrix:
        include: >-
          ${{ github.event_name == 'pull_request'
          && fromJson('[{"elixir":"1.20","otp":"29","check":"full"}]')
          || fromJson('[{"elixir":"1.18","otp":"27","check":"elixir"},{"elixir":"1.20","otp":"29","check":"full"}]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      # file_system uses inotifywait on Linux. The watcher integration test
      # exercises the real backend, which is not bundled with ubuntu-latest.
      - name: Install file-system watcher
        run: sudo apt-get update && sudo apt-get install --yes inotify-tools

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: matrix.check == 'full'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: matrix.check == 'full'
        with:
          node-version: 24
          cache: pnpm

      # Keyed per Elixir/OTP pair: _build (and the dialyzer PLTs inside it)
      # must never be shared across toolchains.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      # The core PLT is the expensive half of dialyzer and depends only on the
      # Erlang/Elixir pair, so it must not share the mix.lock-keyed cache above
      # -- otherwise every dependency bump pays a full core rebuild. The local
      # PLT does track deps and is keyed accordingly.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: matrix.check == 'full'
        with:
          path: priv/plts/core
          key: ${{ runner.os }}-plt-core-${{ matrix.elixir }}-${{ matrix.otp }}

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: matrix.check == 'full'
        with:
          path: priv/plts/local
          key: ${{ runner.os }}-plt-local-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-local-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mkdir -p priv/plts/core priv/plts/local
        if: matrix.check == 'full'

      # phx_new is a fixed archive, so restoring it beats refetching it on every
      # leg of every run.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.mix/archives
          key: ${{ runner.os }}-mix-archives-${{ matrix.elixir }}-${{ matrix.otp }}

      - run: mix deps.get
      - run: pnpm install --frozen-lockfile
        if: matrix.check == 'full'

      # The phoenix_assets.install test scaffolds a throwaway app via
      # Igniter's phx_test_project/1, which shells out to the Phoenix
      # project generator. Install the archive so that test can run, unless the
      # cache above already restored it.
      - run: mix archive | grep -q phx_new || mix archive.install hex phx_new --force

      # Floor leg: compile (warnings as errors) + ExUnit only. Formatting,
      # static analysis, and the frontend run once, on the latest toolchain.
      - run: mix compile --warnings-as-errors
        if: matrix.check == 'elixir'
      - run: mix test
        if: matrix.check == 'elixir'

      # One gate: compile (warnings as errors), format, credo, dialyzer,
      # mix_audit, ExUnit+coverage, biome, typecheck, vitest+coverage, knip,
      # and package-export correctness (publint + arethetypeswrong).
      - run: mix check
        if: matrix.check == 'full'

      - name: Audit JS dependencies (advisory)
        if: matrix.check == 'full'
        run: pnpm audit --prod
        continue-on-error: true

      # One upload per language, so each lcov file is tagged with only its own
      # flag. A single combined upload with `flags: elixir,vite,svelte` tags
      # every file with all three flags, cross-contaminating the per-flag
      # coverage on Codecov.
      - name: Upload Elixir coverage to Codecov
        if: matrix.check == 'full'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          files: cover/lcov.info
          flags: elixir
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Vite coverage to Codecov
        if: matrix.check == 'full'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          files: npm/vite/coverage/lcov.info
          flags: vite
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Svelte coverage to Codecov
        if: matrix.check == 'full'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          files: npm/svelte/coverage/lcov.info
          flags: svelte
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
